<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Список товарів</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body class="flex-container" style="margin-left: 25px;">
    <nav class="navbar navbar-light bg-light">
        <div class="form-inline" style="display: flex; flex-direction: row; align-content: space-between;">
            <button class="btn btn-primary" style="margin-right: 25px;">Додати товар</button>
            <!-- Кнопка фільтру -->
            <button class="btn btn-secondary" id="filterToggle">
                Фільтрувати товари
            </button>
            
            <!-- Бокове меню фільтру -->
            <div id="filterSidebar" class="position-fixed top-0 end-0 bg-light border-start p-3" 
                 style="width: 300px; height: 100%; display: none; z-index: 1050; right: 0; top: 0; overflow-y: auto;">
                <h5>Фільтри</h5>
                <button type="button" class="close float-end mb-3" id="closeFilter"></button>
                
                <form method="GET" action="{% url 'product_list' %}">
                    <!-- Категорії -->
                    <div class="mb-3">
                        <label class="form-label">Категорія</label>
                        {% for cat in categories %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="category" value="{{ cat.id }}" id="cat{{ cat.id }}">
                                <label class="form-check-label" for="cat{{ cat.id }}">{{ cat.category }}</label>
                            </div>
                        {% endfor %}
                    </div>
            
                    <!-- Кольори -->
                    <div class="mb-3">
                        <label class="form-label">Колір</label>
                        {% for c in colors %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="color" value="{{ c.id }}" id="color{{ c.id }}">
                                <label class="form-check-label" for="color{{ c.id }}">{{ c.color }}</label>
                            </div>
                        {% endfor %}
                    </div>
            
                    <!-- Розміри -->
                    <div class="mb-3">
                        <label class="form-label">Розмір</label>
                        {% for s in sizes %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="size" value="{{ s.id }}" id="size{{ s.id }}">
                                <label class="form-check-label" for="size{{ s.id }}">{{ s.size }}</label>
                            </div>
                        {% endfor %}
                    </div>
            
                    <!-- Ціна -->
                    <div class="mb-3">
                        <label class="form-label">Ціна від</label>
                        <input type="number" class="form-control mb-1" name="min_price" placeholder="0">
                        <label class="form-label">Ціна до</label>
                        <input type="number" class="form-control" name="max_price" placeholder="1000">
                    </div>
            
                    <button type="submit" class="btn btn-primary w-100 mt-2">Застосувати</button>
                </form>
            </div>           
            <h1>Список товарів</h1>
            <a href="{% url 'export_excel' %}">
                <button class="btn btn-info" style="margin-left: 25px;">Експортувати в Excel</button>
            </a>
        </div>
    </nav>
    <div class="container">
      <div class="row">
        {% for product in products %}
            <div class="col-12 col-sm-6 col-md-3 mb-4"> <!-- 12 колонок / 3 = 4 картки -->
                <div class="card h-100">
                  {% if product.image %}
                    <img class="card-img-top" src="{{ product.image.url }}" alt="{{ product.name }}" style="max-height: 270px; object-fit: cover;">
                  {% else %}
                    <div class="card-img-top text-center p-5">Немає фото</div>
                  {% endif %}
        
                  <div class="card-body">
                    <h5 class="card-title">{{ product.code }}</h5>
                    <p class="card-text">{{ product.name }}</p>
                    <p class="card-text">{{ product.price }} UAH</p>
                  </div>
                </div>
            </div>
            {% endfor %}
      </div>
</div>
    
    <br>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script>
    const filterToggle = document.getElementById('filterToggle');
    const filterSidebar = document.getElementById('filterSidebar');
    const closeFilter = document.getElementById('closeFilter');

    filterToggle.addEventListener('click', () => {
        filterSidebar.style.display = 'block';
    });

    closeFilter.addEventListener('click', () => {
        filterSidebar.style.display = 'none';
    });

    // закрити по кліку поза меню
    document.addEventListener('click', (e) => {
        if (!filterSidebar.contains(e.target) && e.target !== filterToggle) {
            filterSidebar.style.display = 'none';
        }
    });
</script>
</body>
</html>
